<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Conecta y elige · EducaJuega</title>
    <link rel="icon" type="image/png" href="img/ISOLOGO HORIZONTAL LOTTIS.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="bebidas.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="educa.html#inicio" aria-label="EducaJuega, inicio">
                <img class="brand-logo" src="img/ISOTIPO LOTTIS.png" alt="Logo de EducaJuega">
            </a>
            <nav class="quick-nav" aria-label="Navegación principal">
                <a class="games-nav-link" href="educa.html#inicio" aria-label="Ir al inicio">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="m3.5 10.5 8.5-7 8.5 7v9a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 19.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 21v-6.5a3 3 0 0 1 6 0V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
                <a class="games-nav-link active" href="educa.html#juegos" aria-label="Ir a los juegos" aria-current="page">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M7.3 8h9.4c1.5 0 2.6.9 3 2.4l1.1 5.1c.4 1.8-1.6 3-3 1.9l-2.3-1.8h-7l-2.3 1.8c-1.4 1.1-3.4-.1-3-1.9l1.1-5.1C4.7 8.9 5.8 8 7.3 8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                        <path d="M8 10.5v4M6 12.5h4m5-1h.01m2 2h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </a>
                <a class="games-nav-link" href="educa.html#recompensas" aria-label="Abrir el vestidor">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M8.8 14.1c.8 1 1.9 1.5 3.2 1.5s2.4-.5 3.2-1.5M9 9.7h.01M15 9.7h.01M12 4V2m6.5 3.5 1.2-1.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </a>
            </nav>
        </header>

        <main>
            <section class="game-screen" aria-labelledby="drink-game-title">
                <a class="back-to-games" href="educa.html#juegos">← Volver a los juegos</a>
                <div class="play-panel">
                    <span class="game-label">ESCOGE LA MEJOR OPCIÓN</span>
                    <h1 id="drink-game-title">¿Qué bebida ayuda más?</h1>
                    <p class="play-instructions"><span id="drink-when">Después de comer</span>
                        <button class="speak" type="button" data-speak="drink" aria-label="Escuchar la pregunta">🔊</button></p>

                    <div class="drink-board" id="drink-board">
                        <div class="drink-hero">
                            <img src="img/Jake y Lily.pdf (2).png" alt="Elefante caricaturesco c.">
                            <button class="handle" id="drink-handle" type="button" aria-label="Arrastra hacia la mejor bebida">→</button>
                        </div>
                        <svg class="drink-line" aria-hidden="true"><line id="drink-line-el" x1="0" y1="0" x2="0" y2="0" visibility="hidden"/></svg>
                        <div class="drink-choices" id="drink-choices" role="group" aria-label="Elige una bebida"></div>
                    </div>

                    <p class="game-feedback" id="drink-feedback" aria-live="polite">Arrastra la línea o toca una bebida.</p>
                </div>
            </section>
        </main>
    </div>

    <div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
        <div class="win-card">
            <div class="win-emoji" aria-hidden="true">🎉</div>
            <h2 id="win-title">¡Lo lograste!</h2>
            <div class="win-stars" id="win-stars" aria-live="polite"></div>
            <p id="win-text">¡Muy bien hecho!</p>
            <div class="win-actions">
                <button class="btn-primary" id="win-again" type="button">Jugar otra vez</button>
                <a class="btn-soft" href="ropa.html">Siguiente juego</a>
                <a class="btn-soft" href="educa.html#juegos">Más juegos</a>
            </div>
        </div>
    </div>

    <script src="comun.js"></script>
    <script src="bebidas.js"></script>
</body>
</html>
